<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainGuard AI - Early Warning System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            color: #0B2545;
            text-align: center;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0B2545;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1a3c65;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
            font-weight: bold;
            text-align: center;
        }
        .high-risk {
            background-color: #ffdddd;
            color: #d8000c;
            border: 1px solid #d8000c;
        }
        .moderate-risk {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
        .low-risk {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .disclaimer {
            font-size: 11px;
            color: #999;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>BrainGuard AI</h2>
    <p class="subtitle">Early Warning System for Brain Health</p>

    <div class="form-group">
        <label>Age</label>
        <input type="number" id="age" placeholder="e.g., 45">
    </div>
    
    <div class="form-group">
        <label>Systolic Blood Pressure (Top Number)</label>
        <input type="number" id="sysBP" placeholder="e.g., 150">
    </div>

    <div class="form-group">
        <label>Diastolic Blood Pressure (Bottom Number)</label>
        <input type="number" id="diaBP" placeholder="e.g., 95">
    </div>

    <button onclick="analyzeRisk()">Analyze Risk</button>

    <div id="result"></div>
    
    <div class="disclaimer">
        *This is an AI prototype. It is not a substitute for professional medical advice.
    </div>
</div>

<script>
    function analyzeRisk() {
        // Get user inputs
        const age = parseInt(document.getElementById('age').value);
        const sysBP = parseInt(document.getElementById('sysBP').value);
        const diaBP = parseInt(document.getElementById('diaBP').value);
        
        const resultDiv = document.getElementById('result');
        
        // Validation
        if (!age || !sysBP || !diaBP) {
            alert("Please enter all values to analyze.");
            return;
        }

        // Simulated AI Logic (Based on WHO Hypertension & Stroke Guidelines)
        let riskLevel = "low";
        let message = "";

        // Hypertensive Crisis (Immediate Danger)
        if (sysBP >= 180 || diaBP >= 120) {
            riskLevel = "high";
            message = "🚨 CRITICAL RISK: Hypertensive Crisis. Your blood pressure is dangerously high. Seek emergency medical attention IMMEDIATELY.";
        } 
        // Stage 2 Hypertension
        else if (sysBP >= 140 || diaBP >= 90) {
            riskLevel = "high";
            message = "⚠️ HIGH RISK: Stage 2 Hypertension detected. You are at severe risk of a stroke. Please consult a doctor urgently.";
        }
        // Stage 1 Hypertension
        else if (sysBP >= 130 || diaBP >= 80) {
            riskLevel = "moderate";
            message = "🟡 MODERATE RISK: Stage 1 Hypertension detected. Lifestyle changes and a medical check-up are highly recommended.";
        }
        // Elevated / Normal
        else {
            riskLevel = "low";
            message = "✅ LOW RISK: Your blood pressure is in the normal range. Maintain a healthy lifestyle and monitor regularly.";
        }

        // Output the result
        resultDiv.style.display = "block";
        resultDiv.className = riskLevel + "-risk";
        resultDiv.innerHTML = message;
    }
</script>

</body>
</html>
